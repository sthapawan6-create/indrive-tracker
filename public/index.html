<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#00b894">
    <title>InDrive Tracker</title>
    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00b894; --secondary: #0984e3; --dark: #2d3436; --light: #f8f9fa; --bg: #f0f2f5; --card: #ffffff; --text: #2d3436; }
        .dark-mode { --bg: #1a1a1a; --card: #2d2d2d; --text: #f5f5f5; --light: #3d3d3d; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); margin: 0; padding: 0; color: var(--text); transition: 0.3s; }
        .container { max-width: 480px; margin: auto; min-height: 100vh; background: var(--card); display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.05); }
        .dashboard { background: var(--card); color: var(--text); }
        .history-item { background: var(--card); color: var(--text); border: 1px solid var(--light); }
        input { background: var(--card); color: var(--text); border: 2px solid var(--light); }
        ::-webkit-calendar-picker-indicator { filter: invert(0); }
        .dark-mode ::-webkit-calendar-picker-indicator { filter: invert(1); }
        .theme-toggle { position: absolute; top: 15px; left: 80px; background: rgba(255,255,255,0.2); border: none; color: white; padding: 5px 10px; border-radius: 20px; cursor: pointer; font-size: 14px; }

        /* Header Section */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 20px 90px 20px;
            color: white;
            border-radius: 0 0 35px 35px;
            text-align: center;
            position: relative;
        }
        .user-chip {
            position: absolute; top: 15px; left: 15px;
            display: flex; align-items: center;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px; border-radius: 20px; font-size: 13px;
        }
        .user-chip img { width: 25px; height: 25px; border-radius: 50%; margin-right: 8px; border: 1px solid white; }
        .logout-btn {
            position: absolute; top: 15px; right: 15px;
            background: rgba(0,0,0,0.1); border: 1px solid rgba(255,255,255,0.3);
            color: white; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-size: 11px;
        }

        /* Dashboard Card */
        .dashboard {
            display: flex; justify-content: space-around;
            background: white;
            margin: -50px 20px 20px 20px;
            padding: 25px 10px; border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center; z-index: 10;
        }
        .stat-box { flex: 1; padding: 5px; }
        .stat-box h3 { margin: 0; font-size: 1.1em; font-weight: 700; }
        .stat-box p { margin: 2px 0 0 0; font-size: 9px; color: #95a5a6; text-transform: uppercase; font-weight: 700; }

        /* Form Area */
        .form-area { padding: 10px 25px 25px 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-size: 13px; font-weight: 600; color: #555; }
        input {
            width: 100%; padding: 12px 15px;
            border: 2px solid #f1f3f5; border-radius: 12px;
            font-size: 16px; box-sizing: border-box; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .save-btn {
            width: 100%; padding: 15px;
            background: var(--primary); color: white;
            border: none; border-radius: 12px;
            font-weight: 700; font-size: 16px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,184,148,0.3); transition: 0.3s;
        }
        .save-btn:active { transform: scale(0.98); }

        /* History */
        .history-list { padding: 20px; background: #f8f9fa; flex-grow: 1; border-radius: 30px 30px 0 0; }
        .history-item {
            background: white; padding: 15px; border-radius: 15px; margin-bottom: 12px;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02); border-left: 5px solid var(--primary);
        }

        .hidden { display: none !important; }
        .login-screen { text-align: center; padding: 100px 30px; }
        .google-btn {
            width: 100%; padding: 15px; background: white; border: 1px solid #ddd;
            border-radius: 12px; cursor: pointer; display: flex; align-items: center;
            justify-content: center; gap: 10px; font-weight: 600; font-size: 16px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .google-btn:active { background: #f9f9f9; transform: scale(0.98); }
    </style>
</head>
<body>

<div id="loginSection" class="container">
    <div class="login-screen">
        <h1 style="color: var(--primary); font-size: 2.2em; margin-bottom: 10px;">🚖 InDrive Tracker</h1>
        <p style="color: #666; margin-bottom: 50px;">आफ्नो Gmail बाट लगिन गर्नुहोस्।</p>
        <button class="google-btn" id="loginBtn" onclick="loginWithGoogle()">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G">
            Continue with Google
        </button>
        <p id="statusMsg" style="margin-top: 20px; font-size: 12px; color: #999;"></p>
    </div>
</div>

<div id="mainSection" class="container hidden">
    <div class="header">
        <div class="user-chip">
            <img id="userImg" src="" alt="👤">
            <span id="userName"></span>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()"><i class="fas fa-moon"></i></button>
        <button class="logout-btn" onclick="logout()">Logout</button>
        <h2 style="margin: 0; font-size: 1.8em; letter-spacing: 1px;">DashBoard</h2>
        <p style="font-size: 12px; opacity: 0.8; margin-top: 5px;">आजको प्रगति हेर्नुहोस्</p>
    </div>

    <div class="dashboard" style="display: flex; flex-wrap: wrap;">
        <div class="stat-box">
            <h3 id="totalIncome" style="color: var(--secondary);">Rs. 0</h3>
            <p>कुल कमाइ</p>
        </div>
        <div class="stat-box" style="border-left: 1px solid #eee; border-right: 1px solid #eee;">
            <h3 id="totalExpense" style="color: #ff7675;">Rs. 0</h3>
            <p>कुल खर्च</p>
        </div>
        <div class="stat-box">
            <h3 id="totalSaved" style="color: var(--primary);">Rs. 0</h3>
            <p>कुल बचत</p>
        </div>
    </div>

    <div style="display: flex; justify-content: space-around; padding: 10px; background: #f8f9fa; border-radius: 15px; margin: 0 20px 20px 20px; font-size: 11px;">
        <div><b>औसत बचत:</b> <span id="avgSavings" style="color:var(--primary)">Rs. 0</span></div>
        <div><b>कुल दिन:</b> <span id="recordCount">0</span></div>
    </div>

    <!-- ग्राफ सेक्सन -->
    <div style="padding: 0 20px 20px 20px;">
        <div style="background: var(--card); padding: 15px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); border: 1px solid var(--light);">
            <p style="font-size: 11px; margin-bottom: 10px; font-weight: 700; opacity: 0.7;">📊 खर्चको बाँडफाँड (तेल vs खाजा)</p>
            <div style="height: 10px; background: #eee; border-radius: 5px; display: flex; overflow: hidden; margin-bottom: 15px;">
                <div id="fuelBar" style="width: 50%; background: #ea8685;"></div>
                <div id="foodBar" style="width: 50%; background: #f8c291;"></div>
            </div>
            <canvas id="savingsChart" height="150"></canvas>
        </div>
    </div>

    <div class="form-area">
        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>मिति (Date)</label>
                <input type="date" id="date">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>कुल कमाइ (Rs.)</label>
                <input type="number" id="income" placeholder="उदा: १०००">
            </div>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>पेट्रोल खर्च</label>
                <input type="number" id="fuel" placeholder="२००">
            </div>
            <div class="input-group" style="flex: 1;">
                <label>खाजा खर्च</label>
                <input type="number" id="food" placeholder="१५०">
            </div>
        </div>
        <div class="input-group">
            <label>नोट / टिप्पणी</label>
            <input type="text" id="note" placeholder="आजको विशेष केही...">
        </div>
        <button class="save-btn" id="saveBtn" onclick="saveRecord()">हिसाब सुरक्षित गर्नुहोस्</button>
    </div>

    <div class="history-list">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <p style="font-weight: 700; margin: 0; color: #636e72; font-size: 14px;">📜 पछिल्लो हिसाबहरू</p>
            <div style="display:flex; gap:5px;">
                <button onclick="exportToCSV()" style="padding:5px 10px; font-size:10px; border-radius:8px; border:1px solid var(--primary); background:none; color:var(--primary); cursor:pointer;"><i class="fas fa-file-excel"></i></button>
                <input type="text" id="searchInput" onkeyup="filterHistory()" placeholder="खोज..." style="width: 80px; padding: 5px 10px; font-size: 11px; border-radius: 8px; border: 1px solid #ddd;">
            </div>
        </div>
        <div id="historyItems"></div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDZaWUcQermGfb_pQSxXvYCpDV8i0CbKKk",
        authDomain: "perfect-solution-accounting.firebaseapp.com",
        projectId: "perfect-solution-accounting",
        appId: "1:1047065509704:web:d15acdd34608def4ec7d7d"
    };

    // Initialize Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('mainSection').classList.remove('hidden');
            document.getElementById('userName').innerText = user.displayName.split(' ')[0];
            document.getElementById('userImg').src = user.photoURL;
            loadHistory();
        } else {
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('mainSection').classList.add('hidden');
        }
    });

    function loginWithGoogle() {
        if (window.location.protocol === 'file:') {
            alert("त्रुटि: तपाईंले फाइल सिधै खोल्नुभएको छ। कृपया http://localhost:3000 मा जानुहोस्।");
            return;
        }
        console.log("Login button clicked");
        const btn = document.getElementById('loginBtn');
        btn.innerText = "Connecting...";

        // Try Popup first, fallback to Redirect if environment doesn't support popups
        auth.signInWithPopup(provider)
            .then((result) => {
                console.log("Login success");
            })
            .catch((error) => {
                console.error("Login Error:", error);
                if (error.code === 'auth/operation-not-supported-in-this-environment') {
                    auth.signInWithRedirect(provider);
                } else {
                    alert("लगिनमा समस्या आयो: " + error.message + "\n\nसुझाव: ब्राउजरमा http://localhost:3000 खोल्नुहोस्।");
                    btn.innerHTML = `<img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="G"> Continue with Google`;
                }
            });
    }

    // Handle redirect result
    auth.getRedirectResult().then((result) => {
        if (result.user) console.log("Redirect login success");
    }).catch((error) => {
        console.error("Redirect Error:", error);
    });

    function logout() { if(confirm("Logout गर्ने हो?")) auth.signOut(); }

    async function saveRecord() {
        const dateInput = document.getElementById('date').value;
        const income = document.getElementById('income').value;
        const fuel = document.getElementById('fuel').value;
        const food = document.getElementById('food').value || 0;
        const note = document.getElementById('note').value;
        const btn = document.getElementById('saveBtn');

        if(!income || !fuel) return alert("कृपया कमाइ र पेट्रोल खर्च भर्नुहोस्!");

        btn.innerText = "सेभ हुँदैछ...";
        btn.disabled = true;

        const data = {
            userId: auth.currentUser.uid,
            income: Number(income),
            fuel: Number(fuel),
            food: Number(food),
            note: note,
            date: dateInput ? new Date(dateInput).toLocaleDateString('ne-NP') : undefined
        };

        try {
            const res = await fetch('/api/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            if (res.ok) {
                alert("हिसाब सुरक्षित भयो! ✅");
                document.querySelectorAll('input').forEach(i => i.value = '');
                loadHistory();
            } else {
                alert("डाटा सेभ भएन! सर्भर चेक गर्नुहोस्।");
            }
        } catch (e) {
            alert("सर्भर कनेक्सन एरर!");
        } finally {
            btn.innerText = "हिसाब सुरक्षित गर्नुहोस्";
            btn.disabled = false;
        }
    }

    async function deleteRecord(id) {
        if(!confirm("के तपाइँ यो रेकर्ड हटाउन चाहनुहुन्छ?")) return;
        try {
            const res = await fetch(`/api/delete/${id}`, { method: 'DELETE' });
            if(res.ok) {
                loadHistory();
            }
        } catch (e) { alert("Error deleting record"); }
    }

    let allData = []; // ग्लोबल डाटा राख्न
    let myChart = null;

    async function loadHistory() {
        try {
            const res = await fetch(`/api/history?userId=${auth.currentUser.uid}`);
            allData = await res.json();
            renderHistory(allData);
            updateChart(allData);
        } catch (e) { console.log(e); }
    }

    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const icon = document.querySelector('.theme-toggle i');
        if(document.body.classList.contains('dark-mode')) {
            icon.classList.replace('fa-moon', 'fa-sun');
        } else {
            icon.classList.replace('fa-sun', 'fa-moon');
        }
    }

    function renderHistory(data) {
        const list = document.getElementById('historyItems');
        list.innerHTML = '';

        let tIncome = 0;
        let tFuel = 0;
        let tFood = 0;
        let tSavings = 0;
        const uniqueDays = new Set();

        data.forEach(item => {
            const expense = Number(item.fuel) + Number(item.food || 0);
            const net = item.income - expense;
            const savingsPercent = item.income > 0 ? Math.round((net / item.income) * 100) : 0;

            tIncome += item.income;
            tFuel += item.fuel;
            tFood += (item.food || 0);
            tSavings += net;
            if (item.date) uniqueDays.add(item.date);

            const color = savingsPercent > 60 ? '#00b894' : (savingsPercent < 30 ? '#ff7675' : '#0984e3');

            list.innerHTML += `
                <div class="history-item" style="border-left: 8px solid ${color}; transform: scale(1); transition: 0.2s;" onmouseover="this.style.transform='scale(1.02)'" onmouseout="this.style.transform='scale(1)'">
                    <div class="history-info" style="flex: 1;">
                        <p class="date" style="font-size:11px; color:#999; margin:0; font-weight:600;">📅 ${item.date || 'आज'}</p>
                        <p style="margin:5px 0 0 0; font-size:14px; font-weight:700;">💰 Rs. ${item.income.toLocaleString()}</p>
                        <div style="display:flex; gap:10px; margin-top:3px;">
                            <span style="font-size:10px; color:#ea8685;"><i class="fas fa-gas-pump"></i> ${item.fuel}</span>
                            <span style="font-size:10px; color:#f8c291;"><i class="fas fa-hamburger"></i> ${item.food || 0}</span>
                        </div>
                        ${item.note ? `<p style="margin:8px 0 0 0; font-size:11px; color:#777; background:var(--light); padding:5px 10px; border-radius:8px; border:1px solid rgba(0,0,0,0.05);">📝 ${item.note}</p>` : ''}
                    </div>
                    <div style="text-align:right; display:flex; flex-direction:column; align-items:flex-end; justify-content:space-between; min-width:80px;">
                        <span onclick="deleteRecord('${item._id}')" style="cursor:pointer; font-size:12px; background:#fff5f5; padding:5px; border-radius:50%; margin-bottom:5px; color:#ff7675;"><i class="fas fa-trash"></i></span>
                        <div>
                            <p style="color:${color}; font-weight:800; font-size:1.1em; margin:0;">Rs. ${net.toLocaleString()}</p>
                            <span style="font-size:9px; background:${color}22; color:${color}; padding:2px 6px; border-radius:10px; font-weight:700;">${savingsPercent}% बचत</span>
                        </div>
                    </div>
                </div>
            `;
        });

        const totalExpense = tFuel + tFood;
        const fuelWidth = totalExpense > 0 ? (tFuel / totalExpense) * 100 : 50;
        document.getElementById('fuelBar').style.width = fuelWidth + "%";
        document.getElementById('foodBar').style.width = (100 - fuelWidth) + "%";

        document.getElementById('totalIncome').innerText = "Rs. " + tIncome.toLocaleString();
        document.getElementById('totalExpense').innerText = "Rs. " + totalExpense.toLocaleString();
        document.getElementById('totalSaved').innerText = "Rs. " + tSavings.toLocaleString();
        document.getElementById('recordCount').innerText = uniqueDays.size;
        document.getElementById('avgSavings').innerText = "Rs. " + (uniqueDays.size > 0 ? Math.round(tSavings / uniqueDays.size).toLocaleString() : 0);
    }

    function updateChart(data) {
        const grouped = {};
        // डेटालाई मिति अनुसार जोड्ने
        [...data].forEach(item => {
            const d = item.date;
            const net = item.income - (Number(item.fuel) + Number(item.food || 0));
            grouped[d] = (grouped[d] || 0) + net;
        });

        const sortedDates = Object.keys(grouped).sort((a, b) => {
            const [d1, m1, y1] = a.split('/').map(Number);
            const [d2, m2, y2] = b.split('/').map(Number);
            return new Date(y1, m1-1, d1) - new Date(y2, m2-1, d2);
        });

        const last7Dates = sortedDates.slice(-7);
        const labels = last7Dates.map(d => d.split('/')[0] + '/' + d.split('/')[1]);
        const savingsData = last7Dates.map(d => grouped[d]);

        const ctx = document.getElementById('savingsChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'दैनिक बचत',
                    data: savingsData,
                    borderColor: '#00b894',
                    backgroundColor: 'rgba(0, 184, 148, 0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                plugins: { legend: { display: false } },
                scales: { y: { beginAtZero: true, grid: { display: false } }, x: { grid: { display: false } } }
            }
        });
    }

    function exportToCSV() {
        let csv = "मिति,कमाइ,तेल,खाजा,बचत,नोट\n";
        allData.forEach(item => {
            const net = item.income - (item.fuel + (item.food || 0));
            csv += `${item.date},${item.income},${item.fuel},${item.food || 0},${net},${item.note || ''}\n`;
        });
        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.setAttribute('href', url);
        a.setAttribute('download', `indrive_report_${new Date().toLocaleDateString()}.csv`);
        a.click();
    }

    function filterHistory() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = allData.filter(item =>
            (item.note && item.note.toLowerCase().includes(query)) ||
            (item.date && item.date.includes(query))
        );
        renderHistory(filtered);
    }

    // Service Worker Registration
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
                .then(reg => console.log('Service Worker registered!'))
                .catch(err => console.log('Service Worker registration failed: ', err));
        });
    }
</script>
</body>
</html>
